[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosing-forecast-benchmark"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.1.3"]

[project.scripts]
forecast-bench = "forecast_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["forecast_bench*"]
